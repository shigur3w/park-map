<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="公园打卡">
<meta name="theme-color" content="#2f6b4f">
<title>公园打卡地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="parkdata.js"></script>
<script src="https://unpkg.com/pmtiles@4.4.1/dist/pmtiles.js"></script>
<style>
/* Layout: full-screen map; header on top; list as a bottom sheet on phones, a left panel on wide screens. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --surface-2:#eef2ec; --fg:#1c2420; --muted:#5d6a62; --line:#d6ddd4;
  --accent:#2f6b4f; --accent-fg:#ffffff; --visited:#2e8b57; --todo:#7b857e; --way:#4a7fa8; --ward:#a05a37;
  --stamp:#c4472f; --me:#2a6fdb; --shadow:0 6px 24px rgba(20,32,26,.16);
  --font:"Hiragino Sans","PingFang SC","Noto Sans JP","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --peek:58px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111612; --surface:#19201b; --surface-2:#222b25; --fg:#e5ebe6; --muted:#9ba89f; --line:#2f3933;
  --accent:#62b68a; --accent-fg:#0c1a12; --visited:#4cc07f; --todo:#8e9a92; --way:#73a9d3; --ward:#d58c60;
  --stamp:#e3664c; --me:#5c9cff; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111612; --surface:#19201b; --surface-2:#222b25; --fg:#e5ebe6; --muted:#9ba89f; --line:#2f3933;
  --accent:#62b68a; --accent-fg:#0c1a12; --visited:#4cc07f; --todo:#8e9a92; --way:#73a9d3; --ward:#d58c60;
  --stamp:#e3664c; --me:#5c9cff; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font);-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

#app{position:fixed;inset:0;display:flex;flex-direction:column}
.topbar{flex:none;z-index:500;background:var(--surface);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"brand . menu" "prog prog prog";gap:8px 12px;align-items:center}
.brand{grid-area:brand;display:flex;align-items:center;gap:10px;min-width:0}
.seal{width:34px;height:34px;flex:none;border:2px solid var(--stamp);color:var(--stamp);border-radius:6px;display:grid;place-items:center;
  font-weight:700;font-size:17px;transform:rotate(-4deg);font-family:"Hiragino Mincho ProN","Noto Serif JP","Songti SC",serif}
.brand h1{margin:0;font-size:17px;line-height:1.2;letter-spacing:.02em}
.brand p{margin:0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.actions{grid-area:menu;display:flex;gap:8px;align-items:center}
.city-btn{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.city-btn svg{width:12px;height:12px}
/* City picker */
#cityPanel{position:fixed;z-index:1000;padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
.city-card{width:min(420px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.city-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.city-card .head h2{margin:0}
.city-card .x{border:0;background:none;font-size:22px;line-height:1;color:var(--muted);padding:4px 6px}
.city-list{overflow-y:auto;min-height:0}
.city-list h3{margin:12px 0 4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.city-row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.city-row:hover{border-color:var(--accent)}
.city-row[aria-current="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.city-row strong{font-size:15px}
.city-row small{grid-column:1;color:var(--muted);font-size:12px}
.city-row .cnt{grid-row:1 / span 2;grid-column:2;align-self:center;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.city-row .cnt b{display:block;font-size:15px;color:var(--fg)}
.city-row .bar{grid-column:1 / span 2;margin-top:6px}
.icon-btn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;height:36px;padding:0 12px;font-size:13px}
.progress{grid-area:prog;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pg{min-width:0}
.pg .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pg .row b{color:var(--fg);font-weight:600}
.pg .row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;margin-right:4px}
.pg .row span:last-child{white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--visited);border-radius:3px;transition:width .4s}

.mapwrap{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0 0 var(--peek) 0;z-index:0;background:var(--surface-2)}
.leaflet-container{font-family:var(--font)}
.tiles-dark{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}
.fabs{position:absolute;z-index:450;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(var(--peek) + 92px);display:flex;flex-direction:column;gap:8px}
.fab{
  width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}
.fab svg{width:20px;height:20px;stroke:var(--fg)}
.fab.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Bottom sheet */
.sheet{position:absolute;z-index:480;left:0;right:0;bottom:0;height:calc(var(--peek) + env(safe-area-inset-bottom,0px));
  background:var(--surface);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:var(--shadow);
  display:flex;flex-direction:column;transition:height .25s ease}
.sheet[data-open="true"]{height:min(74%,680px)}
.handle{flex:none;border:0;background:none;padding:8px max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line)}
.handle .sum{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.controls{flex:none;padding:4px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.controls input[type=search]{width:100%;height:38px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:0 12px}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters select{flex:none;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:0 10px;font-size:13px}
.list{flex:1;min-height:0;overflow-y:auto;margin:0;padding:0 0 calc(env(safe-area-inset-bottom,0px) + 12px);list-style:none;border-top:1px solid var(--line)}
.sheet[data-open="false"] .list{display:none}
.item{width:100%;display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;text-align:left;border:0;background:none;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.item:hover{background:var(--surface-2)}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--todo);background:var(--surface)}
.dot.way{border-radius:3px;border-color:var(--way)}
.dot.done{background:var(--visited);border-color:var(--visited)}
.item .txt{min-width:0}
.item strong{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{display:block;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.item .when{font-size:12px;color:var(--stamp);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* Popup */
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.leaflet-popup-content{margin:14px 16px;width:250px!important}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.pop h3{margin:0 18px 2px 0;font-size:16px;line-height:1.3;text-wrap:balance}
.pop .meta{margin:0 0 10px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.stamp-row{display:flex;gap:10px;align-items:center;margin:0 0 10px}
.stamp{width:40px;height:40px;flex:none;border:2px solid var(--stamp);color:var(--stamp);border-radius:50%;display:grid;place-items:center;
  font-weight:700;font-size:16px;transform:rotate(-10deg);font-family:"Hiragino Mincho ProN","Noto Serif JP","Songti SC",serif}
.stamp-row div{font-size:13px;font-variant-numeric:tabular-nums}
.stamp-row div span{display:block;color:var(--muted);font-size:12px}
.pop label{display:block;font-size:12px;color:var(--muted);margin:0 0 3px}
.pop input,.pop textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 8px}
.pop textarea{height:52px;resize:vertical;margin-top:6px}
.pop .btns{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn:disabled{opacity:.5;cursor:default}
.btn.warn{color:var(--stamp)}
.pop .links{display:flex;gap:14px;margin-top:10px;font-size:12px}
.pop .links a{color:var(--accent)}

/* Overlays */
.overlay{position:absolute;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 70%,transparent)}
.card{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px}
.card h2{margin:0 0 6px;font-size:16px}
.card p{margin:0 0 10px;color:var(--muted);font-size:13px}
.card .btns{display:flex;gap:8px;flex-wrap:wrap}
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite;margin-bottom:10px}
.menu{position:absolute;z-index:800;top:8px;right:max(12px,env(safe-area-inset-right,0px));width:min(320px,calc(100% - 24px))}
.menu .card{padding:16px;max-height:calc(100vh - 200px);overflow-y:auto}
.menu h2.sub{margin:18px 0 6px;font-size:14px}
.sync p{margin:0 0 8px}
.sync input{width:100%;height:38px;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:0 10px;margin-bottom:8px}
.row2{display:flex;gap:8px}
.row2 .btn{flex:1;margin-top:0!important;width:auto!important}
.sdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--visited)}
.sdot.pending{background:#d39b2a}
.sdot.error{background:var(--stamp)}
.sdot.busy{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.muni-list h3{margin:12px 0 4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.muni-row{display:block;width:100%;border:0;background:none;padding:5px 0;text-align:left}
.muni-row:hover .row span:first-child{color:var(--accent)}
.progress.three{grid-template-columns:repeat(3,1fr)}
.list .more{padding:12px 16px}
.list .more .btn{width:100%}
.loadbar{margin:0 0 12px}
.menu .btn{width:100%;margin-top:8px;flex:none}
.menu dl{margin:0 0 6px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
.menu dt{color:var(--muted)}
.menu dd{margin:0;font-variant-numeric:tabular-nums}
/* Import results: full-screen, list scrolls inside, buttons stay visible */
#fpPanel{position:fixed;z-index:1000;padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
.fp-card{max-height:100%;height:auto;display:flex;flex-direction:column;width:min(480px,100%);overflow:hidden}
.fp-card > h2,.fp-card > p,.fp-tools{flex:none}
.fp-card .btns{flex:none;padding-top:10px;border-top:1px solid var(--line)}
.fp-card .btns .btn{height:44px}
.fp-tools{display:flex;gap:14px;font-size:13px;margin-bottom:6px}
.fp-tools button{border:0;background:none;color:var(--accent);padding:0}
.fp-list{list-style:none;margin:0;padding:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;min-height:0;flex:1 1 auto;border-top:1px solid var(--line)}
.fp-list label{display:grid;grid-template-columns:20px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.fp-list input{margin-top:3px;accent-color:var(--accent)}
.fp-list strong{display:block;font-weight:600}
.fp-list small{display:block;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.fp-list .tag{color:var(--visited);font-size:12px;margin-left:6px;font-weight:400}
.fp-list .tag.off{color:var(--muted)}
.fp-list .fp-city{position:sticky;top:0;z-index:1;padding:8px 0 4px;background:var(--surface);font-weight:600;font-size:13px;color:var(--accent);border-bottom:1px solid var(--line)}
.toast{position:absolute;z-index:950;left:50%;transform:translateX(-50%);top:12px;background:var(--fg);color:var(--bg);
  padding:8px 14px;border-radius:20px;font-size:13px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.leaflet-control-layers{background:var(--surface);color:var(--fg);border-color:var(--line)!important}
.leaflet-bar a{background:var(--surface);color:var(--fg);border-color:var(--line)}
/* Leaflet's own attribution box grows to three lines with vector maps; a compact one replaces it */
.leaflet-control-attribution{display:none!important}
.attr{display:flex;align-items:flex-start;gap:4px;max-width:min(78vw,420px);margin:0 0 6px 6px!important;padding:2px 7px 2px 3px;border-radius:10px;
  background:color-mix(in srgb,var(--surface) 82%,transparent);color:var(--muted);font-size:10px;line-height:16px}
.attr button{flex:none;width:16px;height:16px;border-radius:50%;border:1px solid var(--muted);background:none;color:var(--muted);font:600 10px/14px Georgia,serif;padding:0}
.attr .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.attr.open .t{white-space:normal}
.attr a{color:var(--accent)}
/* Mobile: tighter header; search and filters only when the list is open */
@media (max-width:899px){
  .topbar{padding-top:calc(env(safe-area-inset-top,0px) + 6px);padding-bottom:7px;gap:5px 10px}
  .seal{width:28px;height:28px;font-size:14px;border-width:1.5px}
  .brand{gap:8px}
  .brand h1{font-size:15px}
  .brand p{font-size:11px}
  .icon-btn{height:30px;padding:0 10px;font-size:12px}
  .actions{gap:6px}
  .pg .row{font-size:11px}
  .bar{height:4px;margin-top:2px}
  .sheet[data-open="false"] .controls{display:none}
  .handle{padding-top:6px;padding-bottom:8px}
}
/* Full-screen map */
.zoom-hint{position:absolute;z-index:440;left:50%;transform:translateX(-50%);bottom:calc(var(--peek) + 34px);max-width:calc(100% - 140px);padding:3px 10px;border-radius:12px;
  background:color-mix(in srgb,var(--surface) 85%,transparent);color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
body.immersive .zoom-hint{bottom:calc(env(safe-area-inset-bottom,0px) + 34px)}
.mini{display:none}
body.immersive .topbar,body.immersive .sheet{display:none!important}
body.immersive #map{inset:0!important}
body.immersive .fabs{bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
body.immersive .leaflet-top{top:env(safe-area-inset-top,0px)}
body.immersive .leaflet-bottom{bottom:env(safe-area-inset-bottom,0px)}
body.immersive .mini{display:flex;position:absolute;z-index:460;left:calc(10px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));
  align-items:center;gap:8px;padding:6px 10px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-size:12px;font-variant-numeric:tabular-nums}
.mini .seal{width:20px;height:20px;font-size:11px;border-width:1.5px;border-radius:4px}
.mini b{font-weight:600}
body.immersive .toast{top:calc(env(safe-area-inset-top,0px) + 56px)}
.fab.on{background:var(--accent)}
.fab.on svg{stroke:var(--accent-fg)}

@media (min-width:900px){
  :root{--peek:0px}
  .topbar{grid-template-columns:auto 1fr auto;grid-template-areas:"brand prog menu"}
  .progress{max-width:460px;justify-self:center;width:100%}
  .sheet,.sheet[data-open="true"],.sheet[data-open="false"]{top:0;right:auto;width:380px;height:auto;border-radius:0;border-top:0;border-right:1px solid var(--line);box-shadow:none}
  .sheet .list{display:block!important}
  .handle{pointer-events:none;padding-top:12px}
  .grip{display:none}
  #map{left:380px}
  .fabs{bottom:96px}
  body.immersive #map{left:0!important}
  .zoom-hint{left:calc(50% + 190px);bottom:34px;max-width:calc(100% - 520px)}
  body.immersive .zoom-hint{left:50%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar">
    <div class="brand">
      <span class="seal" aria-hidden="true">園</span>
      <div><h1>公园打卡</h1><p id="subtitle">—</p></div>
    </div>
    <div class="progress" id="progress"></div>
    <div class="actions">
      <button class="icon-btn city-btn" id="cityBtn" type="button" aria-haspopup="dialog" aria-controls="cityPanel"><span id="cityName">东京</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="icon-btn" id="menuBtn" aria-expanded="false" aria-controls="menu"><span class="sdot" id="syncDot" hidden></span>数据</button>
    </div>
  </header>

  <div class="mapwrap">
    <div id="map" aria-label="公园地图"></div>
    <div class="zoom-hint" id="zoomHint" hidden></div>
    <div class="mini" id="mini" aria-live="polite"><span class="seal" aria-hidden="true">園</span><span id="miniText">—</span></div>
    <div class="fabs">
      <button class="fab" id="fsBtn" aria-label="全屏地图" aria-pressed="false" title="全屏地图">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button class="fab" id="locBtn" aria-label="定位到我的位置" title="我的位置">

// Imported walking points and photo locations are kept, in this browser and (when logged in) as a private

var FP = null; // {n, lat:Int32Array (1e-5 deg), lon:Int32Array, t:Int32Array (unix s), ph:Uint8Array, stamp}

// Matching one city: a park counts when a photo, or two walking points, fall inside it (or within a few

function matchFootprint(pts, entities, tz){

    var days = new Set(); hits.forEach(function(p){ days.add(dayOf(p.t, tz)); });
    var ts = hits.map(function(p){ return p.t; }).sort(function(x, y){ return x - y; });

function matchStamp(region, data){ return (FP ? FP.stamp : 0) + '|' + (data ? data.fetchedAt : 'none'); }

// Footprint in Supabase storage: one private file per account (bucket "footprints", folder = your user id).
var fpSyncing = false;
function syncFootprint(loud){
  if(!sb || !user || fpSyncing) return Promise.resolve();
  fpSyncing = true;
  return fpReady.then(function(){
    return sb.storage.from('footprints').list(user.id, {search:'footprint.bin'});
  }).then(function(res){
    if(res.error) throw res.error;
    var obj = (res.data || []).filter(function(o){ return o.name === 'footprint.bin'; })[0];
    var remoteAt = obj ? (obj.updated_at || obj.created_at) : null, seen = S.get('tpm.fpSeen', null);
    var getRemote = (obj && remoteAt !== seen) ? sb.storage.from('footprints').download(FP_PATH()).then(function(r){ if(r.error) throw r.error; return decodeFP(r.data); }) : Promise.resolve(null);
    return getRemote.then(function(remote){
      var changed = false;
      if(remote){
        var before = FP ? FP.n : 0;
        var merged = FP ? mergeFP(FP, remote) : remote;
        if(merged.n > remote.n) S.set('tpm.fpDirty', true);      // this device has points the cloud lacks
        if(!FP || merged.n !== before){ changed = true; return saveFP(merged, false).then(function(){ S.set('tpm.fpSeen', remoteAt); return changed; }); }
        S.set('tpm.fpSeen', remoteAt);
      }
      return changed;
    });
  }).then(function(changed){
    if(!FP || !S.get('tpm.fpDirty', false)) return changed;
    return encodeFP(FP).then(function(blob){ return blob.arrayBuffer(); }).then(function(bytes){
      // raw bytes (a Blob would be sent as a multipart form)
      return sb.storage.from('footprints').upload(FP_PATH(), bytes, {upsert:true, contentType:'application/octet-stream', cacheControl:'0'});
    }).then(function(r){
      if(r.error) throw r.error;
      S.set('tpm.fpDirty', false);
      return sb.storage.from('footprints').list(user.id, {search:'footprint.bin'}).then(function(l){
        var o = (l.data || []).filter(function(x){ return x.name === 'footprint.bin'; })[0]; if(o) S.set('tpm.fpSeen', o.updated_at || o.created_at);
        if(loud) toast('足迹已存到云端');
        return changed;
      });
    });
  }).then(function(changed){
    fpSyncing = false; renderFpStatus();

  }).catch(function(err){

    var p = $('#fpStatus'); if(p) p.textContent += /bucket/i.test(m) ? '（云端还没建好足迹存储，请在 Supabase 运行 supabase-setup.sql 的最新版本）' : '（足迹同步失败：' + m + '）';
  });
}

// ---------- Records from older versions; seed visited parks ----------
// Old ids were "p|名前"; if that name now exists in several places, attach the record to the one in 世田谷/杉並.
function regionOfId(id){ var r = Object.keys(REGIONS).filter(function(k){ return REGIONS[k].idPrefix && id.indexOf(REGIONS[k].idPrefix) === 0; })[0]; return r || 'tokyo'; }

  var moved = 0, pre = REGION.idPrefix, prefer = REGION.prefer || [];

    if(BYID.has(id) || regionOfId(id) !== REGION.id) return;
    var parts = id.slice(pre.length).split('|'); if(parts.length !== 2 || parts[0] === 'u') return;
    var kind = parts[0] === 'g' ? 'greenway' : null, name = parts[1];
    var cand = DATA.entities.filter(function(e){ return e.name === name && (kind ? e.kind === kind : e.kind !== 'greenway'); });
    if(!cand.length) return;
    var pick = cand.filter(function(e){ return e.munis.some(function(m){ return prefer.indexOf(m) >= 0; }); })[0] || cand[0];
    if(!REC[pick.id]){ REC[pick.id] = REC[id]; delete REC[id]; TOMB[id] = Date.now(); DIRTY[id] = 1; DIRTY[pick.id] = 1; moved++; }
  });
  if(moved) saveRec();
}
function seed(){
  var done = S.get(K.seed, []) || [], want = SEED_NAMES.filter(function(n){ return done.indexOf(n) < 0; });
  if(!want.length) return;
  var hit = [];
  DATA.entities.forEach(function(e){
    var names = [e.name].concat(e.alts).map(normName);
    want.forEach(function(sn){
      if(names.indexOf(normName(sn)) >= 0){ if(!REC[e.id]){ REC[e.id] = {date:null, note:'之前去过', u:1}; DIRTY[e.id] = 1; } if(hit.indexOf(sn) < 0) hit.push(sn); }
    });
  });
  if(hit.length){ saveRec(); S.set(K.seed, done.concat(hit)); toast('已把之前去过的 ' + hit.length + ' 个地方标为打卡'); }
}

// ---------- Load ----------
function showLoading(title, text, error){
  $('#loading').hidden = false; $('#loadTitle').textContent = title; $('#loadText').textContent = text;
  $('#spin').hidden = !!error; $('#loadBtns').hidden = !error; $('#loadBar').hidden = true;
}
function setLoadProgress(done, total, title){
  $('#loadTitle').textContent = title; $('#loadBar').hidden = false; $('#loadBar').firstElementChild.style.width = (done / total * 100).toFixed(0) + '%';
}
$('#retryBtn').addEventListener('click', function(){ loadFromOverpass(true, true); });
function applyData(data, fit){
  if(data.groups && data.munis){ REGION.groups = data.groups; REGION.munis = data.munis; buildMuniSelect(); }
  DATA = data; BYID = new Map(); data.entities.forEach(function(e){ BYID.set(e.id, e); });
  migrateRecords(); seed(); drawAll(); renderProgress(); renderList(); renderMenu();
  if(window.syncSoon && Object.keys(DIRTY).length) window.syncSoon();

  if(fit) map.fitBounds(REGION.view);
}
var loading = false;
// Normal path: data/parks.json, built monthly on GitHub (one request, a few seconds).
// Fallback (no prebuilt file, e.g. the page opened as a local file): query Overpass from the browser.
function fetchPrebuilt(){
  return fetch('data/' + REGION.versionFile, {cache:'no-cache'}).then(function(r){ if(!r.ok) throw new Error('no prebuilt data'); return r.json(); })
    .then(function(ver){ return {ver:ver, get:function(){
      return fetch('data/' + REGION.file + '?v=' + encodeURIComponent(ver.fetchedAt)).then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
    }}; });
}
var loadToken = 0; // bumped when switching city, so a late download for the old city is ignored
function loadData(force){
  if(loading) return;
  var tk = loadToken, R0 = REGION;
  (force ? Promise.resolve(null) : DB.get(R0.dbKey)).then(function(cached){
    if(tk !== loadToken) return;
    var have = !!(cached && cached.v === DATA_VER && cached.entities && cached.entities.length);
    if(have) applyData(cached, false);
    loading = true;
    return fetchPrebuilt().then(function(pb){
      if(pb.ver.v !== DATA_VER) throw new Error('prebuilt data has another format');
      if(have && pb.ver.fetchedAt <= cached.fetchedAt){ loading = false; if(force) toast('公园数据已经是最新的（' + cached.fetchedAt.slice(0, 10) + '）'); return; }
      if(tk !== loadToken){ loading = false; return; }
      if(!have && !DATA) showLoading('正在加载公园数据', R0.all + '约 ' + (pb.ver.count || 0).toLocaleString() + ' 处公园和绿道，几秒钟就好。');
      return pb.get().then(function(data){
        if(data.v !== DATA_VER || !data.entities || !data.entities.length) throw new Error('prebuilt data is empty');
        return DB.set(R0.dbKey, data).then(function(ok){
          if(tk !== loadToken){ loading = false; return; }
          $('#loading').hidden = true; loading = false;
          var first = !DATA;
          applyData(data, first && !view);
          toast(first ? '已加载' + R0.all + ' ' + data.entities.length.toLocaleString() + ' 处公园和绿道' + (ok ? '' : '，但浏览器存储不够，下次打开需要重新下载') : '公园数据已更新到 ' + data.fetchedAt.slice(0, 10));
        });
      });
    }).catch(function(err){
      loading = false;
      if(tk !== loadToken) return;
      if(have && !force) return; // keep using the cached data
      loadFromOverpass(force, true);
    });
  });
}
function loadFromOverpass(force, resume){
  if(loading) return; loading = true;
  var tk = loadToken, R0 = REGION, pre = R0.id === 'tokyo' ? 'chunk:' : R0.dbKey + ':chunk:';
  var cachedP = Promise.resolve(null);
  cachedP.then(function(cached){
    var steps = [{key:pre + 'boundary', label:R0.label + '各区边界', q:boundaryQuery(R0)}].concat(R0.chunks.map(function(c, i){ return {key:pre + i, label:c.label, q:chunkQuery(c.b, R0)}; }));
    showLoading('正在下载' + R0.all + '的公园数据', '分 ' + steps.length + ' 次从 OpenStreetMap 下载，一共大约 3 到 8 分钟，只需要下载这一次。中途断了的话，点重试会从断开的地方继续。');
    var results = [], i = 0;
    function step(){
      if(i >= steps.length) return Promise.resolve();
      var s = steps[i], n = i + 1;
      setLoadProgress(i, steps.length, '正在下载 ' + n + '/' + steps.length + '：' + s.label);
      if(tk !== loadToken) return Promise.reject(new Error('switched'));
      return (force && !resume ? Promise.resolve(undefined) : DB.get(s.key)).then(function(saved){
        if(saved) return saved;
        return overpass(s.q).then(function(j){ var els = j.elements || []; return DB.set(s.key, els).then(function(){ return els; }); });
      }).then(function(els){ results.push(els); i++; return step(); });
    }
    if(force && !resume) Promise.all(steps.map(function(s){ return DB.del(s.key); }));
    step().then(function(){
      setLoadProgress(steps.length, steps.length, '正在整理数据');
      return new Promise(function(r){ setTimeout(r, 30); });
    }).then(function(){
      var data = processData(results[0], results.slice(1), R0);
      if(!data.entities.length) throw new Error('数据服务器没有返回任何公园');
      return DB.set(R0.dbKey, data).then(function(ok){
        if(tk !== loadToken){ loading = false; return; }
        steps.forEach(function(s){ DB.del(s.key); });
        $('#loading').hidden = true; loading = false;
        applyData(data, !DATA && !view);
        toast('已加载' + R0.all + ' ' + data.entities.length.toLocaleString() + ' 处公园和绿道' + (ok ? '' : '，但浏览器存储不够，下次打开需要重新下载'));
      });
    }).catch(function(err){
      loading = false;
      if(tk !== loadToken) return;
      if(DATA){ $('#loading').hidden = true; toast('更新失败，先继续用之前的数据'); return; }
      showLoading('下载到第 ' + (i + 1) + ' 步时断了', '可能是网络不稳定，或者 OpenStreetMap 的数据服务器正忙。已经下载好的部分都保存了，过一会儿点重试，会从断开的地方继续。（' + (err && err.message ? err.message : err) + '）', true);
    });
  });
}

// ---------- Cloud sync (Supabase) ----------
// Each check-in is one row (user_id, park_id). The newer change wins, by the time it was made on the device.
// Un-checking keeps a row with deleted=true so other devices learn about it.
var SB_URL = 'https://vgpocbwfpapobwduhqie.supabase.co';
var SB_KEY = 'sb_publishable_pziloc6EuTby3HNf7Btd3Q_uIDVBmN2';
var sb = null, user = null, syncing = false, syncAgain = false, syncTimer = null, lastSync = S.get('tpm.lastSync', null), syncErr = null;
try{ if(window.supabase) sb = supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storageKey:'tpm.auth'}}); }catch(e){ sb = null; }
function nameOf(id){ var e = BYID.get(id); return e ? e.name : (id.split('|')[1] || id); }
function setSyncUi(state){
  var dot = $('#syncDot');
  $('#syncOut').hidden = !!user; $('#syncIn').hidden = !user;
  if(!sb){ $('#syncOut').querySelector('p').textContent = '同步组件没有加载出来，检查一下网络后刷新页面。'; }
  if(!user){ dot.hidden = true; return; }
  dot.hidden = false; dot.className = 'sdot' + (state === 'busy' ? ' busy' : '') + (syncErr ? ' error' : (Object.keys(DIRTY).length ? ' pending' : ''));
  var t = lastSync ? new Date(lastSync).toLocaleString('zh-CN', {hour12:false, month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '还没有';
  var pend = Object.keys(DIRTY).length;
  $('#syncStatus').textContent = (user.email || '已登录') + '　' + (state === 'busy' ? '正在同步…' : (syncErr ? '同步失败：' + syncErr : '上次同步 ' + t + (pend ? '，还有 ' + pend + ' 条待上传' : '')));
}
function syncNow(loud){
  if(!sb || !user) return Promise.resolve();
  if(syncing){ syncAgain = true; return Promise.resolve(); }
  syncing = true; syncErr = null; setSyncUi('busy');
  var up = [], upTs = {}, down = 0;
  return sb.from('checkins').select('park_id,name,date,note,deleted,updated_at').then(function(res){
    if(res.error) throw res.error;
    var remote = {};
    (res.data || []).forEach(function(r){ remote[r.park_id] = r; });
    Object.keys(remote).forEach(function(id){
      var r = remote[id], rt = Date.parse(r.updated_at) || 0, l = REC[id], lt = l ? (l.u || 1) : (TOMB[id] || 0);
      if(rt > lt){
        if(r.deleted){ if(l){ delete REC[id]; down++; } TOMB[id] = rt; }
        else {
          var title = /\|u\|/.test(id) && r.name && !/·无名公园$/.test(r.name) ? r.name : null;
          REC[id] = {date:r.date || null, note:r.note || '', u:rt}; if(title) REC[id].title = title; delete TOMB[id];
          if(!l || l.date !== r.date || (l.note || '') !== (r.note || '') || (l.title || null) !== title) down++;
        }
        delete DIRTY[id];
      } else if(lt > rt) DIRTY[id] = 1;
    });
    Object.keys(REC).forEach(function(id){ if(!remote[id]) DIRTY[id] = 1; });
    Object.keys(DIRTY).forEach(function(id){
      var l = REC[id], ts = l ? (l.u || 1) : TOMB[id]; if(!ts) { delete DIRTY[id]; return; }
      upTs[id] = ts;
      up.push({user_id:user.id, park_id:id, name:(l && l.title) || nameOf(id), date:l ? (l.date || null) : null, note:l ? (l.note || '') : '', deleted:!l, updated_at:new Date(ts).toISOString()});
    });
    saveRec();
    if(!up.length) return {};
    var chunks = []; for(var i = 0; i < up.length; i += 500) chunks.push(up.slice(i, i + 500));
    return chunks.reduce(function(p, c){ return p.then(function(){ return sb.from('checkins').upsert(c, {onConflict:'user_id,park_id'}).then(function(r){ if(r.error) throw r.error; }); }); }, Promise.resolve());
  }).then(function(){
    Object.keys(upTs).forEach(function(id){ var l = REC[id], ts = l ? (l.u || 1) : TOMB[id]; if(ts === upTs[id]) delete DIRTY[id]; });
    lastSync = Date.now(); S.set('tpm.lastSync', lastSync); saveRec();
    if(DATA && down){ DATA.entities.forEach(restyle); renderProgress(); renderList(); renderMenu(); }
    syncFootprint(false);
    if(loud || down) toast('已同步' + (down ? '：从云端更新了 ' + down + ' 条' : '') + (up.length ? (down ? '，' : '：') + '上传了 ' + up.length + ' 条' : (down ? '' : '，没有新变化')));
  }).catch(function(err){
    var m = (err && (err.message || err.error_description)) || String(err);
    syncErr = /relation .*checkins|does not exist|schema cache/i.test(m) ? '云端还没建表' : (/fetch|network/i.test(m) ? '连不上网络，恢复后会自动重试' : m);
    if(loud) toast('同步失败：' + syncErr);
  }).then(function(){
    syncing = false; setSyncUi();
    if(syncAgain){ syncAgain = false; syncNow(false); }
  });
}
window.syncSoon = function(){ setSyncUi(); if(!user) return; clearTimeout(syncTimer); syncTimer = setTimeout(function(){ syncNow(false); }, 1500); };
function authMsg(err){
  var m = (err && err.message) || String(err);
  if(/Invalid login credentials/i.test(m)) return '邮箱或密码不对';
  if(/Email not confirmed/i.test(m)) return '请先点确认邮件里的链接，再回来登录';
  if(/already registered|already exists/i.test(m)) return '这个邮箱已经注册过了，直接登录就行';
  if(/at least 6|Password should/i.test(m)) return '密码至少要 6 位';
  if(/Signups not allowed/i.test(m)) return '这个项目已经关闭了新用户注册';
  if(/not authorized/i.test(m)) return '注册邮件发不出去：请让管理员在 Supabase 里关闭 Confirm email';
  if(/rate limit|too many/i.test(m)) return '操作太频繁了，过几分钟再试';
  if(/fetch|network/i.test(m)) return '连不上服务器，检查一下网络';
  return m;
}
function authInputs(){
  var em = $('#authEmail').value.trim(), pw = $('#authPw').value;
  if(!/^\S+@\S+\.\S+$/.test(em)){ toast('邮箱格式不对'); return null; }
  if(pw.length < 6){ toast('密码至少要 6 位'); return null; }
  return {email:em, password:pw};
}
$('#authForm').addEventListener('submit', function(ev){

    .catch(function(e){ toast(authMsg(e)); }).then(function(){ $('#loginBtn').disabled = false; });
});
$('#signupBtn').addEventListener('click', function(){
  if(!sb) return; var c = authInputs(); if(!c) return;
  $('#signupBtn').disabled = true;
  sb.auth.signUp({email:c.email, password:c.password, options:{emailRedirectTo:location.origin + location.pathname}}).then(function(r){
    if(r.error) throw r.error;
    if(r.data && r.data.session) toast('注册成功，已登录');
    else toast('确认邮件已发到 ' + c.email + '，点里面的链接后回来登录');
  }).catch(function(e){ toast(authMsg(e)); }).then(function(){ $('#signupBtn').disabled = false; });
});
$('#syncNowBtn').addEventListener('click', function(){ syncNow(true); });
$('#logoutBtn').addEventListener('click', function(){ if(sb) sb.auth.signOut().then(function(){ toast('已退出登录，本机的打卡记录还在'); }); });
if(sb){
  sb.auth.onAuthStateChange(function(event, session){

function markRegionButtons(){ $('#cityName').textContent = REGION.label; }
function useBase(name){ if(!bases[name] || name === baseName) return; map.removeLayer(bases[baseName]); baseName = name; bases[name].addTo(map); setCredit(); }

// City picker: one row per entry in REGIONS, grouped by country, with each city's check-in progress.
var cityTotals = {};
function cityCount(id){ return Object.keys(REC).filter(function(k){ return regionOfId(k) === id; }).length; }
